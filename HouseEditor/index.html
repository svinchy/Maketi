<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <title>House Editor</title>
  <style>
    @font-face {
      font-family: 'ALKTallMtavruli';
      src: url('../files/assets/fonts/alk-tall-mtavruli-webfont.woff2') format('woff2'),
           url('../files/assets/fonts/alk-tall-mtavruli-webfont.woff') format('woff');
      font-weight: 400;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #FDFFD4; /* design-system cream */
      font-family: 'ALKTallMtavruli', 'Helvetica Neue', Arial, sans-serif;
      color: #000;
    }
    #editor { position: fixed; inset: 0; }

    /* ---- configurator panel ---- */
    .panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      width: 300px;
      display: flex;
      flex-direction: column;
      background: rgba(253, 255, 212, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-left: 1px solid rgba(0, 0, 0, 0.65);
      overflow: hidden;
    }
    .page-logo {
      position: fixed;
      top: 24px;
      left: 32px;
      z-index: 10;
      height: 56px;
    }
    .panel-body { flex: 1; overflow-y: auto; padding: 20px; }
    .panel .panel-title {
      font-size: 26px;
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 4px;
    }
    .panel h2 {
      font-size: 18px;
      font-weight: 400;
      margin-bottom: 4px;
    }
    .panel .group { margin-top: 20px; }
    .panel .group-title {
      font-size: 17px;
      color: rgba(0, 0, 0, 0.6);
      margin-bottom: 10px;
    }
    .panel .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .panel .opt {
      appearance: none;
      border: 1px solid rgba(0, 0, 0, 0.15);
      background: #fff;
      border-radius: 0;
      padding: 11px 12px;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      font-size: 17px;
      line-height: 1.2;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .panel .opt .price {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      color: rgba(0, 0, 0, 0.45);
    }
    .panel .opt:hover { border-color: rgba(0, 0, 0, 0.4); }
    .panel .options.stack { grid-template-columns: 1fr; }
    .panel .sub-label {
      font-size: 14px;
      color: rgba(0, 0, 0, 0.5);
      margin: 10px 0 6px;
    }
    .panel .sub-chips {
      display: flex;
      gap: 6px;
      padding: 2px 0 4px 10px;
      border-left: 2px solid rgba(217, 96, 60, 0.4);
      margin-left: 4px;
    }
    .panel .chip {
      appearance: none;
      font-family: inherit;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      background: #fff;
      cursor: pointer;
      transition: all 0.15s;
    }
    .panel .chip:hover { border-color: rgba(0, 0, 0, 0.4); }
    .panel .chip.active {
      background: #D9603C;
      border-color: #D9603C;
      color: #fff;
    }
    .panel .chip.disabled { opacity: 0.35; pointer-events: none; }
    @keyframes flashPulse {
      0% { box-shadow: 0 0 0 3px rgba(217, 96, 60, 0.6); background: rgba(217, 96, 60, 0.16); }
      100% { box-shadow: 0 0 0 3px rgba(217, 96, 60, 0); background: transparent; }
    }
    .panel .flash { animation: flashPulse 1.2s ease-out; border-radius: 12px; }
    .panel .size-inputs { display: flex; gap: 8px; margin-top: 8px; }
    .panel .size-inputs label {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 15px;
      color: rgba(0, 0, 0, 0.6);
    }
    .panel .size-inputs input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 0;
      background: #fff;
      font-family: inherit;
      font-size: 17px;
      color: #000;
    }
    .panel .size-inputs input:focus { outline: none; border-color: #D9603C; }
    .panel .opt.active {
      background: #D9603C;
      border-color: #D9603C;
      color: #fff;
    }
    .panel .opt.active .price { color: rgba(255, 255, 255, 0.8); }
    .panel-total {
      border-top: 1px solid rgba(0, 0, 0, 0.1);
      padding: 16px 20px;
      background: #fff;
    }
    .panel-total .row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(0, 0, 0, 0.5);
      margin-bottom: 6px;
    }
    .panel-total .total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 20px;
    }
    .panel-total .hint {
      margin-top: 6px;
      font-size: 10px;
      color: rgba(0, 0, 0, 0.35);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <img class="page-logo" src="../files/assets/images/logo2.svg" alt="Maketi">
  <div id="editor"></div>
  <script type="module">
    import { setupHouseEditor } from './editor.js'
    window.__editor = setupHouseEditor(document.getElementById('editor'))
  </script>
</body>
</html>
